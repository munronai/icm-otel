requires-python = ">=3.11,<3.14"
dependencies = [
    "arize-phoenix-client>=1.0.0",
    "arize-phoenix-evals>=1.0.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "google-genai>=1.0.0",
]

[tool.uv]
package = false
